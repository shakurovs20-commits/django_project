services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: possword
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    working_dir: /app
    command: >
      sh -c "python project/manage.py migrate &&
             python project/manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    environment:
      DJANGO_SECRET_KEY: 'django-insecure-!)9a#@fk2l_x3v_b1n4m5q6w7e8r9t0y'
      POSTGRES_DB: db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: possword
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DJANGO_SETTINGS_MODULE: my_project.settings
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: